name: Refresh data & publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 6"   # Saturdays 14:00 UTC (after the Friday US close)
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-fetch market data and rebuild analyses before publishing"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Silicon supply chain — fetch, analyze, chart, report
        working-directory: analyses/silicon-supply-chain
        run: |
          python fetch.py
          python analysis.py
          python charts.py
          python build_report.py
      - name: Commit refreshed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Weekly data refresh $(date -u +%Y-%m-%d)"
          git push

  build:
    needs: refresh
    if: always() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
