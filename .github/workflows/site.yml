name: Refresh data & publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * 6"    # weekly research refresh: Saturdays 14:00 UTC (after the Friday US close)
    - cron: "17 * * * *"    # hourly trade signals
  workflow_dispatch:
    inputs:
      weekly:
        description: "Re-run the full weekly research pipeline (slow)"
        type: boolean
        default: false
      signals:
        description: "Re-run the hourly trade signals"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      WEEKLY: ${{ github.event.schedule == '0 14 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.weekly) }}
      SIGNALS: ${{ github.event.schedule == '17 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.signals) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Weekly research — fetch, analyze, chart, report, export model inputs
        if: env.WEEKLY == 'true'
        timeout-minutes: 30
        working-directory: analyses/silicon-supply-chain
        run: |
          python fetch.py
          python analysis.py
          python charts.py
          python build_report.py
          python ../trade-signals/export_inputs.py
      - name: Hourly trade signals
        if: env.SIGNALS == 'true'
        timeout-minutes: 12
        working-directory: analyses/trade-signals
        run: python signals.py
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs analyses/trade-signals/state
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          msg="Signals update $(date -u +'%Y-%m-%d %H:%M UTC')"
          [ "$WEEKLY" = "true" ] && msg="Weekly research refresh + signals $(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -q -m "$msg"
          git pull -q --rebase origin main
          git push -q

  build:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
