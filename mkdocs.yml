site_name: Investment Opportunities
site_description: Research notebooks that apply Bodie-Kane-Marcus "Investments" methods to real markets.
site_url: https://findnavish.github.io/InvestmentOpportunities/
repo_url: https://github.com/findnavish/InvestmentOpportunities
repo_name: findnavish/InvestmentOpportunities
edit_uri: ""

theme:
  name: material
  icon:
    logo: material/chart-line
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js
  - javascripts/nav-chart.js

nav:
  - Home: index.md
  - Hourly Trade Signals: trade-signals/index.md
  - Analyses:
      - Silicon Supply Chain — Top 30: silicon-supply-chain/index.md
  - Stock Deep Dives:
      - Scoreboard: deep-dives/index.md
      - Semiconductors & hardware:
          - AMD: deep-dives/amd/index.md
          - NVDA: deep-dives/nvda/index.md
          - INTC: deep-dives/intc/index.md
          - MU: deep-dives/mu/index.md
          - SMCI: deep-dives/smci/index.md
      - Mega-cap tech:
          - MSFT: deep-dives/msft/index.md
          - AAPL: deep-dives/aapl/index.md
          - GOOGL: deep-dives/googl/index.md
          - META: deep-dives/meta/index.md
          - AMZN: deep-dives/amzn/index.md
      - Software & AI:
          - PLTR: deep-dives/pltr/index.md
          - AI: deep-dives/ai/index.md
      - Quantum computing:
          - IONQ: deep-dives/ionq/index.md
          - RGTI: deep-dives/rgti/index.md
      - Autos & EVs:
          - TSLA: deep-dives/tsla/index.md
          - RIVN: deep-dives/rivn/index.md
          - LCID: deep-dives/lcid/index.md
          - F: deep-dives/f/index.md
      - Internet & media:
          - SNAP: deep-dives/snap/index.md
          - PINS: deep-dives/pins/index.md
          - SIRI: deep-dives/siri/index.md
          - DIDIY: deep-dives/didiy/index.md
      - Industrials & energy:
